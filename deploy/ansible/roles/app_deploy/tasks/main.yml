---
- name: Pull latest application image
  docker_image:
    name: "{{ app_image }}"
    source: pull
    force_source: yes

- name: Stop and remove existing container if running
  docker_container:
    name: boat-app
    state: absent

- name: Run application container
  docker_container:
    name: boat-app
    image: "{{ app_image }}"
    ports:
      - "8000:8000"
    restart_policy: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
