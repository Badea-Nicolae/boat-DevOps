name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ⿡ Ia codul din repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # ⿢ Instalează Python (🔹 acesta e blocul care lipsea)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ⿣ Instalează dependințele din requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ⿤ Rulează testele (doar simulare momentan)
      - name: Run tests
        run: |
          echo "✅ All tests passed successfully!"

      # ⿥ Construiește imaginea Docker
      - name: Build Docker image
        run: |
          docker build -t boat-devops-app .

      # ⿦ Rulează containerul din imaginea creată
      - name: Run container
        run: |
          docker run --rm -d -p 8000:8000 --name boat-app $(docker images -q boat-devops-app)
